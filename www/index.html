<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ТЭМ18ДМ с ЭСУВТ — Интерактивные ГОСТ Схемы</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #151c2c;
      --bg-panel: #22304a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --active-wire: #ef4444;
      --active-glow: rgba(239, 68, 68, 0.7);
      --power-plus: #f59e0b;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(90deg, #151c2c 0%, #0b0f19 100%);
      padding: 12px 16px;
      border-bottom: 1px solid #22304a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-group h1 {
      font-size: 1.15rem;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .title-group span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .tabs-bar {
      display: flex;
      overflow-x: auto;
      background: var(--bg-card);
      border-bottom: 1px solid #22304a;
      scrollbar-width: thin;
    }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .controls-bar {
      background: var(--bg-card);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #22304a;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: #334155; }
    .btn.primary { background: #0284c7; border-color: #38bdf8; }
    .btn.primary:hover { background: #0369a1; }
    .btn.auto-active { background: #dc2626; border-color: #f87171; }

    .step-counter {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--power-plus);
      background: rgba(245, 158, 11, 0.12);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .canvas-box {
      background: #05080f;
      border: 1px solid #22304a;
      border-radius: 10px;
      position: relative;
      overflow: auto;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    }

    svg {
      width: 100%;
      height: auto;
      max-height: 540px;
      min-width: 850px;
    }

    .gost-wire {
      fill: none;
      stroke: #475569;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s;
    }
    .gost-wire.active {
      stroke: var(--active-wire);
      stroke-width: 3.5;
      stroke-dasharray: 8 6;
      animation: flow 0.5s linear infinite;
      filter: drop-shadow(0 0 5px var(--active-glow));
    }

    @keyframes flow {
      to { stroke-dashoffset: -14; }
    }

    .gost-symbol {
      stroke: #cbd5e1;
      stroke-width: 2;
      fill: #151c2c;
      cursor: pointer;
      transition: all 0.2s;
    }
    .gost-symbol:hover {
      stroke: #38bdf8;
      stroke-width: 2.5;
    }
    .gost-symbol.energized {
      stroke: var(--success);
      stroke-width: 2.5;
      fill: #064e3b;
      filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.6));
    }
    .gost-symbol.active-contact {
      stroke: #f43f5e;
      stroke-width: 2.5;
      fill: #3b0764;
      filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.8));
    }
    .gost-symbol.broken {
      stroke: #ef4444 !important;
      stroke-dasharray: 4 2;
    }

    .gost-text {
      fill: #e2e8f0;
      font-size: 11px;
      font-family: monospace;
      text-anchor: middle;
      pointer-events: none;
    }
    .wire-num-gost {
      fill: #fbbf24;
      font-size: 10px;
      font-family: monospace;
      text-anchor: middle;
    }
    .section-title {
      fill: #38bdf8;
      font-size: 12px;
      font-weight: bold;
      font-family: sans-serif;
    }

    .info-panel {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 16px;
      border-left: 4px solid var(--accent);
      border: 1px solid #22304a;
      border-left-width: 4px;
    }
    .info-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .info-chain {
      font-family: monospace;
      background: #0b0f19;
      padding: 10px;
      border-radius: 6px;
      color: #fde047;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 8px;
      border: 1px solid #151c2c;
      overflow-x: auto;
    }
    .info-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .jumpers-grid {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }
    .jumper-card {
      background: var(--bg-card);
      border: 1px solid #22304a;
      border-left: 4px solid var(--power-plus);
      border-radius: 8px;
      padding: 14px;
    }
    .jumper-card h3 {
      font-size: 0.95rem;
      color: var(--power-plus);
      margin-bottom: 8px;
    }
    .jumper-card p {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>ТЭМ18ДМ с ЭСУВТ и УСТА</h1>
    <span>Интерактивные ГОСТ Схемы (Управление и Силовая часть)</span>
  </div>
</header>

<nav class="tabs-bar" id="tabsBar"></nav>

<main>
  <div class="controls-bar" id="controlsBar">
    <div class="btn-group">
      <button class="btn" onclick="prevStep()">◀ Назад</button>
      <button class="btn primary" onclick="nextStep()">Шаг вперёд ▶</button>
      <button class="btn" id="autoBtn" onclick="toggleAuto()">⏯ Автозапуск</button>
      <button class="btn" onclick="resetScheme()">↺ Сброс</button>
    </div>
    <div class="step-counter" id="stepCounter">Шаг 1 / 1</div>
  </div>

  <div class="canvas-box" id="canvasBox">
    <svg id="schematicSvg" viewBox="0 0 920 460"></svg>
  </div>

  <div class="info-panel" id="infoPanel">
    <div class="info-title" id="stepTitle">Выберите шаг</div>

    <div class="info-desc" id="stepDesc">Кликните по любому аппарату на схеме для проверки исправности.</div>
  </div>

  <div class="jumpers-grid" id="jumpersGrid"></div>
</main>

let currentTab = 0;
let currentStep = 0;
let autoTimer = null;

function initApp() {
  const tabsBar = document.getElementById("tabsBar");
  SCHEMES.forEach((sch, idx) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (idx === 0 ? " active" : "");
    btn.textContent = sch.title;
    btn.onclick = () => selectTab(idx);
    tabsBar.appendChild(btn);
  });

  const jmpBtn = document.createElement("button");
  jmpBtn.className = "tab-btn";
  jmpBtn.textContent = "9. Перемычки и Неисправности";
  jmpBtn.onclick = () => selectTab(SCHEMES.length);
  tabsBar.appendChild(jmpBtn);

  renderJumpers();
  selectTab(0);
}

function selectTab(idx) {
  stopAuto();
  currentTab = idx;
  currentStep = 0;

  const buttons = document.querySelectorAll(".tab-btn");
  buttons.forEach((b, i) => b.classList.toggle("active", i === idx));

  const isJumpers = idx === SCHEMES.length;
  document.getElementById("controlsBar").style.display = isJumpers ? "none" : "flex";
  document.getElementById("canvasBox").style.display = isJumpers ? "none" : "flex";
  document.getElementById("infoPanel").style.display = isJumpers ? "none" : "block";
  document.getElementById("jumpersGrid").style.display = isJumpers ? "grid" : "none";

  if (!isJumpers) {
    drawGostSchematic(SCHEMES[currentTab]);
    updateStepView();
  }
}

function drawGostSchematic(scheme) {
  const svg = document.getElementById("schematicSvg");
  svg.innerHTML = "";

  // Рисуем разделы (Вспомогательные / Силовые цепи)
  if (scheme.sections) {
    scheme.sections.forEach(sec => {
      const stxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      stxt.setAttribute("x", sec.x);
      stxt.setAttribute("y", sec.y);
      stxt.setAttribute("class", "section-title");
      stxt.textContent = sec.text;
      svg.appendChild(stxt);
    });
  }

  // Провода
  scheme.wires.forEach(w => {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", w.d);
    path.setAttribute("id", w.id);
    path.setAttribute("class", "gost-wire");
    svg.appendChild(path);

    if (w.label) {
      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", w.lx);
      txt.setAttribute("y", w.ph - 8);
      txt.setAttribute("class", "wire-num-gost");
      txt.textContent = w.label;
      svg.appendChild(txt);
    }
  });

  // Элементы ГОСТ с интерактивным кликом (диагностика/обрыв)
  scheme.elements.forEach(el => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("id", "elem_" + el.id);
    g.setAttribute("transform", `translate(${el.x}, ${el.y})`);
    g.style.cursor = "pointer";

    // Клик по аппарату проверяет его исправность (интерактивный режим)
    g.onclick = () => {
      const sym = g.querySelector(".gost-symbol");
      if (sym.classList.contains("broken")) {
        sym.classList.remove("broken");
        alert(`Аппарат [${el.label} - ${el.sub}] восстановлен (исправен).`);
      } else {
        sym.classList.add("broken");
        alert(`ВНИМАНИЕ: Имитация неисправности (обрыв / заклинивание) аппарата [${el.label} - ${el.sub}]! Цепь в этом месте разорвана.`);
      }
    };

    let symbolSvg = "";
    if (el.type === "coil") {
      symbolSvg = `
        <rect x="-25" y="-18" width="50" height="36" class="gost-symbol" rx="3"/>
        <line x1="-25" y1="0" x2="-35" y2="0" class="gost-symbol"/>
        <line x1="25" y1="0" x2="35" y2="0" class="gost-symbol"/>
        <text x="0" y="4" class="gost-text">${el.label}</text>
      `;
    } else if (el.type === "contact_no") {
      symbolSvg = `
        <line x1="-25" y1="0" x2="-10" y2="0" class="gost-symbol"/>
        <line x1="10" y1="0" x2="25" y2="0" class="gost-symbol"/>
        <line x1="-10" y1="12" x2="8" y2="-12" class="gost-symbol"/>
        <text x="0" y="-18" class="gost-text">${el.label}</text>
      `;
    } else if (el.type === "contact_nc") {
      symbolSvg = `
        <line x1="-25" y1="0" x2="-10" y2="0" class="gost-symbol"/>
        <line x1="10" y1="0" x2="25" y2="0" class="gost-symbol"/>
        <line x1="-10" y1="-12" x2="10" y2="12" class="gost-symbol"/>
        <text x="0" y="-18" class="gost-text">${el.label}</text>
      `;
    } else if (el.type === "switch") {
      symbolSvg = `
        <circle cx="-15" cy="0" r="3" class="gost-symbol" fill="#cbd5e1"/>
        <circle cx="15" cy="0" r="3" class="gost-symbol" fill="#cbd5e1"/>
        <line x1="-15" y1="0" x2="12" y2="-10" class="gost-symbol"/>
        <text x="0" y="-18" class="gost-text">${el.label}</text>
      `;
    } else if (el.type === "fuse") {
      symbolSvg = `
        <rect x="-20" y="-8" width="40" height="16" class="gost-symbol"/>
        <line x1="-20" y1="0" x2="-30" y2="0" class="gost-symbol"/>
        <line x1="20" y1="0" x2="30" y2="0" class="gost-symbol"/>
        <text x="0" y="3" class="gost-text">${el.label}</text>
      `;
    } else {
      symbolSvg = `
        <rect x="-22" y="-15" width="44" height="30" class="gost-symbol"/>
        <text x="0" y="4" class="gost-text">${el.label}</text>
      `;
    }

    g.innerHTML = symbolSvg;
    svg.appendChild(g);
  });
}

function updateStepView() {
  const scheme = SCHEMES[currentTab];
  const step = scheme.steps[currentStep];

  document.getElementById("stepCounter").textContent = `Шаг ${currentStep + 1} / ${scheme.steps.length}`;
  document.getElementById("stepTitle").textContent = step.title;
  document.getElementById("stepChain").textContent = step.chain;
  document.getElementById("stepDesc").textContent = step.desc + " (Кликните по любому аппарату на схеме для проверки/обрыва)";

  scheme.wires.forEach(w => {
    const el = document.getElementById(w.id);
    if (el) el.classList.toggle("active", step.activeWires.includes(w.id));
  });

  scheme.elements.forEach(el => {
    const node = document.getElementById("elem_" + el.id);
    if (node) {
      const sym = node.querySelector(".gost-symbol");
      if (sym && !sym.classList.contains("broken")) {
        sym.classList.remove("energized", "active-contact");
        if (step.activeElements.includes(el.id)) {
          sym.classList.add("active-contact");
        } else if (step.energizedElements.includes(el.id)) {
          sym.classList.add("energized");
        }
      }
    }
  });
}

function nextStep() {
  const scheme = SCHEMES[currentTab];
  currentStep = (currentStep + 1) % scheme.steps.length;
  updateStepView();
}

function prevStep() {
  const scheme = SCHEMES[currentTab];
  currentStep = (currentStep - 1 + scheme.steps.length) % scheme.steps.length;
  updateStepView();
}

function resetScheme() {
  stopAuto();
  currentStep = 0;
  updateStepView();
}

function toggleAuto() {
  if (autoTimer) {
    stopAuto();
  } else {
    document.getElementById("autoBtn").classList.add("auto-active");
    document.getElementById("autoBtn").textContent = "⏸ Пауза";
    autoTimer = setInterval(nextStep, 3500);
  }
}

function stopAuto() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
  }
  const btn = document.getElementById("autoBtn");
  if (btn) {
    btn.classList.remove("auto-active");
    btn.textContent = "⏯ Автозапуск";
  }
}

function renderJumpers() {
  const grid = document.getElementById("jumpersGrid");
  grid.innerHTML = JUMPERS.map(j => `
    <div class="jumper-card">
      <h3>${j.title}</h3>
      <p><strong>Причина:</strong> ${j.desc}</p>
      <p><strong>Решение:</strong> ${j.fix}</p>
    </div>
  `).join("");
}

window.onload = initApp;
