<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes">
  <title>ТЭМ18ДМ с ЭСУВТ — Точная заводская схема (Интерактив)</title>
  <style>
    :root {
      --bg-dark: #070a12;
      --bg-card: #111827;
      --bg-panel: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --wire-red: #991b1b;
      --wire-green: #166534;
      --wire-blue: #1e40af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
      padding: 10px 14px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title-group h1 { font-size: 1.05rem; color: var(--accent); }
    .title-group span { font-size: 0.76rem; color: var(--text-muted); }

    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .file-btn {
      background: #0369a1;
      color: #fff;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #38bdf8;
    }
    .file-btn input { display: none; }

    .tabs-bar {
      display: flex;
      overflow-x: auto;
      background: var(--bg-card);
      border-bottom: 1px solid #334155;
    }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
    }
    .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.04); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
    }

    .controls-bar {
      background: var(--bg-card);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid #334155;
    }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid #475569;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #334155; }
    .btn.primary { background: #0284c7; border-color: #38bdf8; }
    .btn.auto-active { background: #dc2626; border-color: #f87171; }
    .btn.fault-btn { background: #991b1b; border-color: #f87171; display: none; }

    .step-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.14);
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    /* Рабочее поле заводской схемы */
    .canvas-wrap {
      background: #060911;
      background-image: 
        linear-gradient(rgba(30, 41, 59, 0.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 41, 59, 0.45) 1px, transparent 1px);
      background-size: 25px 25px;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: auto;
      position: relative;
      max-height: 64vh;
      min-height: 430px;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.85);
    }
    .canvas-wrap.light-paper {
      background: #f8fafc;
      background-image: 
        linear-gradient(rgba(203, 213, 225, 0.6) 1px, transparent 1px),
        linear-gradient(90deg, rgba(203, 213, 225, 0.6) 1px, transparent 1px);
    }

    .stage-inner {
      position: relative;
      width: 1350px;
      height: 760px;
      transform-origin: top left;
    }

    #bgPhoto {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.35;
      display: none;
      pointer-events: none;
    }

    svg {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Заводские линии проводов по цветам оригинала */
    .f-wire {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.25s, opacity 0.25s;
    }
    .f-wire.red { stroke: #7f1d1d; }
    .f-wire.green { stroke: #14532d; }
    .f-wire.blue { stroke: #1e3a8a; }
    .f-wire.black { stroke: #475569; }
    .f-wire.power { stroke: #991b1b; stroke-width: 3.8; }

    .light-paper .f-wire.red { stroke: #fca5a5; }
    .light-paper .f-wire.green { stroke: #86efac; }
    .light-paper .f-wire.blue { stroke: #93c5fd; }
    .light-paper .f-wire.black { stroke: #cbd5e1; }

    /* Подсвеченный провод под напряжением */
    .f-wire.energized.red { stroke: #ef4444; }
    .f-wire.energized.green { stroke: #22c55e; }
    .f-wire.energized.blue { stroke: #38bdf8; }
    .f-wire.energized.black { stroke: #eab308; }
    .f-wire.energized.power { stroke: #f97316; }

    /* Анимация бегущего тока */
    .f-flow {
      fill: none;
      stroke: transparent;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .f-flow.active {
      stroke: #ff2a2a;
      stroke-dasharray: 10 8;
      animation: runCurrent 0.42s linear infinite;
      filter: drop-shadow(0 0 6px #ff0000);
    }
    .f-flow.active-green {
      stroke: #4ade80;
      stroke-dasharray: 10 8;
      animation: runCurrent 0.42s linear infinite;
      filter: drop-shadow(0 0 6px #22c55e);
    }
    .f-flow.active-blue {
      stroke: #38bdf8;
      stroke-dasharray: 10 8;
      animation: runCurrent 0.42s linear infinite;
      filter: drop-shadow(0 0 6px #0284c7);
    }
    .f-flow.active-power {
      stroke: #fbbf24;
      stroke-width: 5;
      stroke-dasharray: 14 10;
      animation: runCurrent 0.32s linear infinite;
      filter: drop-shadow(0 0 8px #f59e0b);
    }

    @keyframes runCurrent {
      to { stroke-dashoffset: -18; }
    }

    /* Узловые точки пайки/соединений */
    .junc-dot { fill: #64748b; transition: 0.25s; }
    .junc-dot.on { fill: #ff3b3b; r: 4.5; filter: drop-shadow(0 0 4px #ff0000); }

    /* Аппараты на чертеже */
    .app-node { cursor: pointer; }
    .app-node:hover .app-box, .app-node:hover .app-blade { stroke: #38bdf8; }

    .app-box {
      fill: #0f172a;
      stroke: #94a3b8;
      stroke-width: 2;
      transition: 0.25s;
    }
    .light-paper .app-box { fill: #ffffff; stroke: #334155; }

    .app-node.on .app-box {
      fill: #052e16;
      stroke: #22c55e;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.7));
    }
    .light-paper .app-node.on .app-box { fill: #dcfce7; stroke: #16a34a; }

    .app-node.fault .app-box {
      fill: #450a0a !important;
      stroke: #ef4444 !important;
      stroke-dasharray: 3 2;
    }

    .app-blade {
      stroke: #cbd5e1;
      stroke-width: 2.5;
      stroke-linecap: round;
      transition: all 0.28s ease;
    }
    .light-paper .app-blade { stroke: #1e293b; }
    .app-node.on .app-blade {
      stroke: #4ade80;
      filter: drop-shadow(0 0 5px #22c55e);
    }
    .app-node.fault .app-blade { stroke: #ef4444 !important; }

    /* Тексты и номера проводов */
    .lbl-main {
      fill: #f8fafc;
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
    }
    .light-paper .lbl-main { fill: #0f172a; }

    .lbl-sub {
      fill: #94a3b8;
      font-size: 9px;
      text-anchor: middle;
      pointer-events: none;
    }
    .light-paper .lbl-sub { fill: #475569; }

    .w-num {
      fill: #fde047;
      font-family: monospace;
      font-size: 9.5px;
      font-weight: 600;
      text-anchor: middle;
      pointer-events: none;
    }
    .light-paper .w-num { fill: #b91c1c; font-weight: 700; }

    .block-frame {
      fill: rgba(15, 23, 42, 0.55);
      stroke: #475569;
      stroke-width: 1.8;
      stroke-dasharray: 6 4;
    }
    .light-paper .block-frame { fill: rgba(241, 245, 249, 0.7); stroke: #1e40af; }

    /* Инфо-панель */
    .info-panel {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 12px 14px;
      border: 1px solid #334155;
      border-left: 4px solid var(--accent);
    }
    .info-panel.fault-mode { border-left-color: #ef4444; background: #1f1215; }
    .info-title { font-size: 0.98rem; font-weight: 700; color: var(--accent); margin-bottom: 5px; }
    .info-chain {
      font-family: monospace;
      background: #05080f;
      padding: 8px 10px;
      border-radius: 6px;
      color: #fde047;
      font-size: 0.82rem;
      line-height: 1.45;
      margin-bottom: 6px;
      border: 1px solid #1e293b;
    }
    .info-desc { font-size: 0.86rem; color: #cbd5e1; line-height: 1.45; }

    .jumpers-grid {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 10px;
    }
    .jumper-card {
      background: var(--bg-card);
      border: 1px solid #334155;
      border-left: 4px solid #f59e0b;
      border-radius: 8px;
      padding: 12px;
    }
    .jumper-card h3 { font-size: 0.92rem; color: #fbbf24; margin-bottom: 6px; }
    .jumper-card p { font-size: 0.82rem; color: #cbd5e1; line-height: 1.4; margin-bottom: 5px; }
  </style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>ТЭМ18ДМ с ЭСУВТ — Заводская схема с живой анимацией тока</h1>
    <span>Точная топология по листам схемы • Клик по любому контакту/катушке имитирует обрыв</span>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="togglePaperTheme()">🌗 Фон: Тёмный / Бумажный чертёж</button>
    <label class="file-btn">
      🖼 Подложить скриншот схемы
      <input type="file" accept="image/*" onchange="loadBgPhoto(event)">
    </label>
  </div>
</header>

<nav class="tabs-bar" id="tabsBar"></nav>

<main>
  <div class="controls-bar" id="controlsBar">
    <div class="btn-group">
      <button class="btn" onclick="prevStep()">◀ Шаг назад</button>
      <button class="btn primary" onclick="nextStep()">Шаг вперёд ▶</button>
      <button class="btn" id="autoBtn" onclick="toggleAuto()">⏯ Автозапуск</button>
      <button class="btn" onclick="zoomCanvas(1.2)">🔍 +</button>
      <button class="btn" onclick="zoomCanvas(0.85)">🔎 -</button>
      <button class="btn" onclick="resetScheme()">↺ Сброс</button>
      <button class="btn fault-btn" id="clearFaultBtn" onclick="clearFaults()">🛠 Устранить обрыв</button>
    </div>
    <div class="step-badge" id="stepCounter">Шаг 1 / 1</div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="stage-inner" id="stageInner">
      <img id="bgPhoto" alt="">
      <svg id="mainSvg" viewBox="0 0 1350 760"></svg>
    </div>
  </div>

  <div class="info-panel" id="infoPanel">
    <div class="info-title" id="stepTitle"></div>
    <div class="info-chain" id="stepChain"></div>
    <div class="info-desc" id="stepDesc"></div>
  </div>

  <div class="jumpers-grid" id="jumpersGrid"></div>
</main>

<script>
