<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>ТЭМ18ДМ с ЭСУВТ — Детальный интерактивный тренажёр</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-card: #111827;
      --bg-panel: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --wire-off: #334155;
      --wire-on: #ff2a2a;
      --wire-power: #f59e0b;
      --coil-on: #22c55e;
      --fault: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
      padding: 10px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .title-group h1 { font-size: 1.1rem; color: var(--accent); }
    .title-group span { font-size: 0.78rem; color: var(--text-muted); }

    .legend {
      display: flex;
      gap: 12px;
      font-size: 0.75rem;
      color: #cbd5e1;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    .tabs-bar {
      display: flex;
      overflow-x: auto;
      background: var(--bg-card);
      border-bottom: 1px solid #334155;
    }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 11px 15px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
    }
    .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.04); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .controls-bar {
      background: var(--bg-card);
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #334155;
    }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn:hover { background: #334155; }
    .btn.primary { background: #0284c7; border-color: #38bdf8; }
    .btn.primary:hover { background: #0369a1; }
    .btn.auto-active { background: #dc2626; border-color: #f87171; }
    .btn.fault-clear { background: #7c2d12; border-color: #f97316; display: none; }

    .step-badge {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    /* Контейнер детального чертежа */
    .canvas-box {
      background: #04070d;
      background-image: 
        radial-gradient(rgba(51, 65, 85, 0.35) 1px, transparent 1px);
      background-size: 20px 20px;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: auto;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
    }

    svg {
      display: block;
      width: 100%;
      min-width: 1080px;
      height: auto;
    }

    /* Провода и анимация тока */
    .wire-base {
      fill: none;
      stroke: var(--wire-off);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.25s;
    }
    .wire-base.power-thick { stroke-width: 4; }
    .wire-base.energized {
      stroke: #991b1b;
    }
    .wire-flow {
      fill: none;
      stroke: transparent;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .wire-flow.active {
      stroke: #ff3b3b;
      stroke-dasharray: 10 8;
      animation: currentFlow 0.45s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255, 50, 50, 0.9));
    }
    .wire-flow.power-active {
      stroke: #fbbf24;
      stroke-width: 4.5;
      stroke-dasharray: 14 10;
      animation: currentFlow 0.35s linear infinite;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.9));
    }

    @keyframes currentFlow {
      to { stroke-dashoffset: -18; }
    }

    /* Шины питания */
    .bus-plus { stroke: #dc2626; stroke-width: 4; }
    .bus-minus { stroke: #2563eb; stroke-width: 4; }
    .sec-header {
      fill: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Стили аппаратов (катушки, контакты, клеммы) */
    .comp-group { cursor: pointer; }
    .comp-group:hover .comp-shape { stroke: #38bdf8; }

    .comp-shape {
      fill: #0f172a;
      stroke: #94a3b8;
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    .comp-group.on .comp-shape {
      stroke: #22c55e;
      fill: #052e16;
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.65));
    }
    .comp-group.fault .comp-shape {
      stroke: #ef4444 !important;
      fill: #450a0a !important;
      stroke-dasharray: 4 2;
    }

    /* Подвижный нож контакта */
    .contact-blade {
      stroke: #cbd5e1;
      stroke-width: 2.5;
      stroke-linecap: round;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.3s;
      transform-box: fill-box;
      transform-origin: left center;
    }
    .comp-group.on .contact-blade {
      stroke: #4ade80;
      filter: drop-shadow(0 0 5px #22c55e);
    }
    .comp-group.fault .contact-blade {
      stroke: #ef4444 !important;
    }

    .comp-label {
      fill: #f8fafc;
      font-size: 11.5px;
      font-weight: bold;
      text-anchor: middle;
      pointer-events: none;
    }
    .comp-sub {
      fill: #94a3b8;
      font-size: 9.5px;
      text-anchor: middle;
      pointer-events: none;
    }
    .wire-tag {
      fill: #fde047;
      font-family: monospace;
      font-size: 10px;
      text-anchor: middle;
      pointer-events: none;
    }
    .term-circle {
      fill: #0f172a;
      stroke: #38bdf8;
      stroke-width: 1.8;
    }
    .term-text {
      fill: #7dd3fc;
      font-size: 9.5px;
      font-family: monospace;
      text-anchor: middle;
    }

    /* Панель описания */
    .info-panel {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 14px;
      border: 1px solid #334155;
      border-left: 4px solid var(--accent);
    }
    .info-panel.fault-alert {
      border-left-color: #ef4444;
      background: #1f1215;
    }
    .info-title { font-size: 1rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .info-chain {
      font-family: monospace;
      background: #070b14;
      padding: 9px 12px;
      border-radius: 6px;
      color: #fde047;
      font-size: 0.83rem;
      line-height: 1.5;
      margin-bottom: 8px;
      border: 1px solid #1e293b;
    }
    .info-desc { font-size: 0.88rem; color: #cbd5e1; line-height: 1.45; }

    /* Карточки перемычек */
    .jumpers-grid {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 12px;
    }
    .jumper-card {
      background: var(--bg-card);
      border: 1px solid #334155;
      border-left: 4px solid var(--wire-power);
      border-radius: 8px;
      padding: 14px;
    }
    .jumper-card h3 { font-size: 0.95rem; color: #fbbf24; margin-bottom: 8px; }
    .jumper-card p { font-size: 0.84rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 6px; }
  </style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>ТЭМ18ДМ с ЭСУВТ и УСТА — Полные электрические схемы</h1>
    <span>Кликните по любому реле или контакту на схеме для имитации обрыва (поиска неисправности)</span>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:#ff3b3b"></span> Ток управления (75В)</div>
    <div class="legend-item"><span class="dot" style="background:#fbbf24"></span> Силовой ток</div>
    <div class="legend-item"><span class="dot" style="background:#22c55e"></span> Аппарат включен</div>
    <div class="legend-item"><span class="dot" style="background:#ef4444"></span> Обрыв (Клик по элементу)</div>
  </div>
</header>

<nav class="tabs-bar" id="tabsBar"></nav>

<main>
  <div class="controls-bar" id="controlsBar">
    <div class="btn-group">
      <button class="btn" onclick="prevStep()">◀ Шаг назад</button>

      <button class="btn" id="autoBtn" onclick="toggleAuto()">⏯ Автозапуск</button>
      <button class="btn" onclick="resetScheme()">↺ Сброс</button>
      <button class="btn fault-clear" id="clearFaultsBtn" onclick="clearAllFaults()">🛠 Устранить обрывы</button>
    </div>
    <div class="step-badge" id="stepCounter">Шаг 1 / 1</div>
  </div>

  <div class="canvas-box" id="canvasBox">
    <svg id="schematicSvg" viewBox="0 0 1120 620"></svg>
  </div>

  <div class="info-panel" id="infoPanel">
    <div class="info-title" id="stepTitle">Загрузка...</div>
    <div class="info-chain" id="stepChain"></div>
    <div class="info-desc" id="stepDesc"></div>
  </div>

  <div class="jumpers-grid" id="jumpersGrid"></div>
</main>

let currentTab = 0;
let currentStep = 0;
let autoTimer = null;
let faultedComps = new Set();

function initApp() {
  const tabsBar = document.getElementById("tabsBar");
  SCHEMES.forEach((sch, idx) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (idx === 0 ? " active" : "");
    btn.textContent = sch.title;
    btn.onclick = () => selectTab(idx);
    tabsBar.appendChild(btn);
  });

  const jmpBtn = document.createElement("button");
  jmpBtn.className = "tab-btn";
  jmpBtn.textContent = "9. Перемычки и Неисправности";
  jmpBtn.onclick = () => selectTab(SCHEMES.length);
  tabsBar.appendChild(jmpBtn);

  renderJumpers();
  selectTab(0);
}

function selectTab(idx) {
  stopAuto();
  currentTab = idx;
  currentStep = 0;
  faultedComps.clear();
  updateFaultBtn();

  document.querySelectorAll(".tab-btn").forEach((b, i) => b.classList.toggle("active", i === idx));

  const isJumpers = idx === SCHEMES.length;
  document.getElementById("controlsBar").style.display = isJumpers ? "none" : "flex";
  document.getElementById("canvasBox").style.display = isJumpers ? "none" : "block";
  document.getElementById("infoPanel").style.display = isJumpers ? "none" : "block";
  document.getElementById("jumpersGrid").style.display = isJumpers ? "grid" : "none";

  if (!isJumpers) {
    renderDetailedScheme(SCHEMES[currentTab]);
    updateStepState();
  }
}

function renderDetailedScheme(sch) {
  const svg = document.getElementById("schematicSvg");
  svg.setAttribute("viewBox", `0 0 1120 ${sch.height}`);
  svg.innerHTML = "";

  // Левая шина (+75В / +АБ) и правая шина (-АБ)
  svg.innerHTML += `
    <line x1="60" y1="35" x2="60" y2="${sch.height - 25}" class="bus-plus"/>
    <text x="60" y="25" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle">+75В / +АБ</text>
    <line x1="1040" y1="35" x2="1040" y2="${sch.height - 25}" class="bus-minus"/>
    <text x="1040" y="25" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">-АБ (Минус)</text>
  `;

  // Заголовки секций
  sch.headers.forEach(h => {
    svg.innerHTML += `<text x="550" y="${h.y}" class="sec-header" text-anchor="middle">━━━ ${h.text} ━━━</text>`;
  });

  // Отрисовка каждой горизонтальной ветви (rung)
  sch.rungs.forEach(r => {
    // Соединительные провода между аппаратами
    r.wires.forEach((w, wi) => {
      const wid = `${r.id}_w${wi}`;
      svg.innerHTML += `
        <line id="${wid}_base" x1="${w.x1}" y1="${r.y}" x2="${w.x2}" y2="${r.y}" class="wire-base ${r.power ? 'power-thick' : ''}"/>
        <line id="${wid}_flow" x1="${w.x1}" y1="${r.y}" x2="${w.x2}" y2="${r.y}" class="wire-flow"/>
        <text x="${(w.x1 + w.x2) / 2}" y="${r.y - 8}" class="wire-tag">${w.num}</text>
      `;
    });

    // Клеммные зажимы
    r.terms.forEach(t => {
      svg.innerHTML += `
        <circle cx="${t.x}" cy="${r.y}" r="5" class="term-circle"/>
        <text x="${t.x}" y="${r.y + 17}" class="term-text">[${t.label}]</text>
      `;
    });

    // Аппараты (ширина каждого аппарата 60px: от x-30 до x+30)
    r.comps.forEach(c => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("id", `comp_${c.id}`);
      g.setAttribute("class", "comp-group");
      g.setAttribute("transform", `translate(${c.x}, ${r.y})`);
      g.onclick = () => toggleFault(c.id, c.label);

      let inner = "";
      if (c.type === "coil") {
        // Катушка реле/контактора (ГОСТ прямоугольник с выводами)
        inner = `
          <line x1="-30" y1="0" x2="-22" y2="0" class="wire-base"/>
          <line x1="22" y1="0" x2="30" y2="0" class="wire-base"/>
          <rect x="-22" y="-15" width="44" height="30" rx="3" class="comp-shape"/>
          <line x1="-10" y1="-15" x2="-10" y2="15" stroke="#475569" stroke-width="1"/>
          <line x1="10" y1="-15" x2="10" y2="15" stroke="#475569" stroke-width="1"/>
        `;
      } else if (c.type === "no" || c.type === "btn" || c.type === "switch") {
        // Нормально разомкнутый контакт / Кнопка / Тумблер (при срабатывании нож опускается!)
        inner = `
          <line x1="-30" y1="0" x2="-16" y2="0" class="wire-base"/>
          <line x1="16" y1="0" x2="30" y2="0" class="wire-base"/>
          <circle cx="-16" cy="0" r="3.5" class="comp-shape"/>
          <circle cx="16" cy="0" r="3.5" class="comp-shape"/>
          <line id="blade_${c.id}" x1="-16" y1="0" x2="15" y2="-14" class="contact-blade"/>
        `;
      } else if (c.type === "nc") {
        // Нормально замкнутый контакт
        inner = `
          <line x1="-30" y1="0" x2="-16" y2="0" class="wire-base"/>
          <line x1="16" y1="0" x2="30" y2="0" class="wire-base"/>
          <circle cx="-16" cy="0" r="3.5" class="comp-shape"/>
          <circle cx="16" cy="0" r="3.5" class="comp-shape"/>
          <line x1="16" y1="-10" x2="16" y2="4" stroke="#94a3b8" stroke-width="2"/>
          <line id="blade_${c.id}" x1="-16" y1="0" x2="16" y2="0" class="contact-blade"/>
        `;
      } else if (c.type === "fuse") {
        // Предохранитель / Шунт
        inner = `
          <line x1="-30" y1="0" x2="30" y2="0" stroke="#94a3b8" stroke-width="2"/>
          <rect x="-20" y="-9" width="40" height="18" class="comp-shape" fill="none"/>
        `;
      } else if (c.type === "motor") {
        // Электродвигатель / Якорь генератора (круг с щетками)
        inner = `
          <line x1="-30" y1="0" x2="-20" y2="0" class="wire-base"/>
          <line x1="20" y1="0" x2="30" y2="0" class="wire-base"/>
          <rect x="-22" y="-5" width="5" height="10" fill="#cbd5e1"/>
          <rect x="17" y="-5" width="5" height="10" fill="#cbd5e1"/>
          <circle cx="0" cy="0" r="18" class="comp-shape"/>
          <text x="0" y="4" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">М/Г</text>
        `;
      } else if (c.type === "resistor") {
        // Резистор / Обмотка возбуждения
        inner = `
          <line x1="-30" y1="0" x2="-22" y2="0" class="wire-base"/>
          <line x1="22" y1="0" x2="30" y2="0" class="wire-base"/>
          <rect x="-22" y="-10" width="44" height="20" class="comp-shape"/>
          <path d="M -18 0 Q -12 -9 -6 0 T 6 0 T 18 0" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
        `;
      }

      inner += `
        <text x="0" y="-20" class="comp-label">${c.label}</text>
        <text x="0" y="27" class="comp-sub">${c.sub}</text>
        <text id="fault_x_${c.id}" x="0" y="6" fill="#ef4444" font-size="22" font-weight="bold" text-anchor="middle" display="none">✖</text>
      `;

      g.innerHTML = inner;
      svg.appendChild(g);
    });
  });
}

function toggleFault(compId, label) {
  if (faultedComps.has(compId)) {
    faultedComps.delete(compId);
  } else {
    faultedComps.add(compId);
  }
  updateFaultBtn();
  updateStepState();
}

function clearAllFaults() {
  faultedComps.clear();
  updateFaultBtn();
  updateStepState();
}

function updateFaultBtn() {
  const btn = document.getElementById("clearFaultsBtn");
  btn.style.display = faultedComps.size > 0 ? "inline-flex" : "none";
}

function updateStepState() {
  const sch = SCHEMES[currentTab];
  const step = sch.steps[currentStep];

  document.getElementById("stepCounter").textContent = `Шаг ${currentStep + 1} / ${sch.steps.length}`;

  let brokenNames = [];

  sch.rungs.forEach(r => {
    const rungShouldBeActive = step.activeRungs.includes(r.id);

    // Проверяем, есть ли обрыв в этой ветке и на каком по счету аппарате
    let faultIndex = -1;
    r.comps.forEach((c, idx) => {
      if (faultedComps.has(c.id) && faultIndex === -1) {
        faultIndex = idx;
        if (rungShouldBeActive) brokenNames.push(`${c.label} (${c.sub})`);
      }
    });

    // Обновляем провода в ветке (ток доходит только ДО оборванного аппарата!)
    r.wires.forEach((w, wi) => {
      const baseEl = document.getElementById(`${r.id}_w${wi}_base`);
      const flowEl = document.getElementById(`${r.id}_w${wi}_flow`);
      const canFlow = rungShouldBeActive && (faultIndex === -1 || wi <= faultIndex);

      if (baseEl) baseEl.classList.toggle("energized", canFlow);
      if (flowEl) {
        flowEl.classList.remove("active", "power-active");
        if (canFlow) {
          flowEl.classList.add(r.power ? "power-active" : "active");
        }
      }
    });

    // Обновляем аппараты и физический поворот ножей контактов
    r.comps.forEach((c, idx) => {
      const g = document.getElementById(`comp_${c.id}`);
      const blade = document.getElementById(`blade_${c.id}`);
      const fx = document.getElementById(`fault_x_${c.id}`);
      const isFault = faultedComps.has(c.id);

      if (fx) fx.setAttribute("display", isFault ? "block" : "none");
      if (!g) return;

      g.classList.toggle("fault", isFault);

      // Аппарат включен, если он в списке onComps и до него не оборвана активная цепь
      const blockedByFault = rungShouldBeActive && faultIndex !== -1 && idx >= faultIndex;
      const isOn = !isFault && !blockedByFault && step.onComps.includes(c.id);

      g.classList.toggle("on", isOn);

      // Живое переключение контактов!
      if (blade) {
        if (c.type === "no" || c.type === "btn" || c.type === "switch") {
          // Если включен — нож опускается горизонтально, замыкая цепь
          blade.setAttribute("y2", isOn ? "0" : "-14");
        } else if (c.type === "nc") {
          // Если размыкающий контакт НЕ в списке onComps на этом шаге (или оборван) — он размыкается!
          const closed = !isFault && step.onComps.includes(c.id);
          blade.setAttribute("y2", closed ? "0" : "-13");
        }
      }
    });
  });

  const panel = document.getElementById("infoPanel");
  if (brokenNames.length > 0) {
    panel.classList.add("fault-alert");
    document.getElementById("stepTitle").textContent = `⚠️ ОБРЫВ ЦЕПИ! Отказал аппарат: ${brokenNames.join(", ")}`;
    document.getElementById("stepChain").textContent = `Ток остановлен перед неисправным элементом [${brokenNames[0]}]. Дальнейший сбор схемы невозможен!`;
    document.getElementById("stepDesc").textContent = `Чтобы продолжить работу схемы, кликните повторно по неисправному аппарату (или нажмите «Устранить обрывы»), либо посмотрите способ постановки аварийной перемычки во вкладке №9.`;
  } else {
    panel.classList.remove("fault-alert");
    document.getElementById("stepTitle").textContent = step.title;
    document.getElementById("stepChain").textContent = step.chain;
    document.getElementById("stepDesc").textContent = step.desc;
  }
}

function nextStep() {
  const sch = SCHEMES[currentTab];
  currentStep = (currentStep + 1) % sch.steps.length;
  updateStepState();
}

function prevStep() {
  const sch = SCHEMES[currentTab];
  currentStep = (currentStep - 1 + sch.steps.length) % sch.steps.length;
  updateStepState();
}

function resetScheme() {
  stopAuto();
  currentStep = 0;
  updateStepState();
}

function toggleAuto() {
  if (autoTimer) {
    stopAuto();
  } else {
    document.getElementById("autoBtn").classList.add("auto-active");
    document.getElementById("autoBtn").textContent = "⏸ Пауза";
    autoTimer = setInterval(nextStep, 3500);
  }
}

function stopAuto() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
  }
  const btn = document.getElementById("autoBtn");
  if (btn) {
    btn.classList.remove("auto-active");
    btn.textContent = "⏯ Автозапуск";
  }
}

function renderJumpers() {
  const grid = document.getElementById("jumpersGrid");
  grid.innerHTML = JUMPERS.map(j => `
    <div class="jumper-card">
      <h3>${j.title}</h3>
      <p><strong>Симптом / Причина:</strong> ${j.desc}</p>
      <p><strong>Выход из положения (Перемычка):</strong> ${j.fix}</p>
    </div>
  `).join("");
}

window.onload = initApp;
