<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ТЭМ18ДМ с ЭСУВТ — Интерактивные схемы</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-panel: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --active-wire: #ef4444;
      --active-glow: rgba(239, 68, 68, 0.6);
      --power-plus: #f59e0b;
      --power-minus: #3b82f6;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-group h1 {
      font-size: 1.15rem;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .title-group span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Навигация по вкладкам */
    .tabs-bar {
      display: flex;
      overflow-x: auto;
      background: var(--bg-card);
      border-bottom: 1px solid #334155;
      scrollbar-width: thin;
    }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    /* Основной контейнер */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* Панель управления шагами */
    .controls-bar {
      background: var(--bg-card);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #334155;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: #475569; }
    .btn.primary { background: #0284c7; border-color: #38bdf8; }
    .btn.primary:hover { background: #0369a1; }
    .btn.auto-active { background: #dc2626; border-color: #f87171; }

    .step-counter {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--power-plus);
      background: rgba(245, 158, 11, 0.12);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* Поле SVG-схемы */
    .canvas-box {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 10px;
      position: relative;
      overflow: auto;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
    }

    svg {
      width: 100%;
      height: auto;
      max-height: 480px;
      min-width: 750px;
    }

    /* Стили элементов SVG */
    .wire {
      fill: none;
      stroke: #475569;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s;
    }
    .wire.active {
      stroke: var(--active-wire);
      stroke-width: 4;
      stroke-dasharray: 10 6;
      animation: flow 0.6s linear infinite;
      filter: drop-shadow(0 0 6px var(--active-glow));
    }

    @keyframes flow {
      to { stroke-dashoffset: -16; }
    }

    .node-box {
      fill: #1e293b;
      stroke: #64748b;
      stroke-width: 2;
      rx: 6;
      transition: all 0.3s;
    }
    .node-box.active {
      fill: #3b0764;
      stroke: #f43f5e;
      stroke-width: 3;
      filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.7));
    }
    .node-box.energized {
      fill: #064e3b;
      stroke: var(--success);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.5));
    }

    .node-label {
      fill: #f8fafc;
      font-size: 13px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .node-sub {
      fill: #94a3b8;
      font-size: 10px;
      text-anchor: middle;
      pointer-events: none;
    }
    .wire-num {
      fill: #fbbf24;
      font-size: 11px;
      font-family: monospace;
      text-anchor: middle;
      background: #0f172a;
    }

    /* Блок описания текущего шага */
    .info-panel {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 16px;
      border-left: 4px solid var(--accent);
      border-top: 1px solid #334155;
      border-right: 1px solid #334155;
      border-bottom: 1px solid #334155;
    }
    .info-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .info-chain {
      font-family: monospace;
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      color: #fde047;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 8px;
      border: 1px solid #1e293b;
      overflow-x: auto;
    }
    .info-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    /* Справочник перемычек */
    .jumpers-grid {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }
    .jumper-card {
      background: var(--bg-card);
      border: 1px solid #334155;
      border-left: 4px solid var(--power-plus);
      border-radius: 8px;
      padding: 14px;
    }
    .jumper-card h3 {
      font-size: 0.95rem;
      color: var(--power-plus);
      margin-bottom: 8px;
    }
    .jumper-card p {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 6px;
    }
  </style>
</head>

<header>
  <div class="title-group">
    <h1>ТЭМ18ДМ с ЭСУВТ и УСТА</h1>
    <span>Интерактивный тренажёр электрических цепей (по пособию Романенко)</span>
  </div>
</header>

<nav class="tabs-bar" id="tabsBar"></nav>

<main>

    <div class="btn-group">
      <button class="btn" onclick="prevStep()">◀ Назад</button>

      <button class="btn" onclick="resetScheme()">↺ Сброс</button>
    </div>
    <div class="step-counter" id="stepCounter">Шаг 1 / 1</div>
  </div>

  <div class="canvas-box" id="canvasBox">
    <svg id="schematicSvg" viewBox="0 0 900 420"></svg>

    <div class="info-desc" id="stepDesc">Описание работы узла...</div>

  <div class="jumpers-grid" id="jumpersGrid"></div>
</main>

let currentTab = 0;
let currentStep = 0;
let autoTimer = null;

function initApp() {
  const tabsBar = document.getElementById("tabsBar");
  SCHEMES.forEach((sch, idx) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (idx === 0 ? " active" : "");
    btn.textContent = sch.title;
    btn.onclick = () => selectTab(idx);
    tabsBar.appendChild(btn);
  });

  // Вкладка перемычек
  const jmpBtn = document.createElement("button");
  jmpBtn.className = "tab-btn";
  jmpBtn.textContent = "9. Перемычки и Неисправности";
  jmpBtn.onclick = () => selectTab(SCHEMES.length);
  tabsBar.appendChild(jmpBtn);

  renderJumpers();
  selectTab(0);
}

function selectTab(idx) {
  stopAuto();
  currentTab = idx;
  currentStep = 0;

  const buttons = document.querySelectorAll(".tab-btn");
  buttons.forEach((b, i) => b.classList.toggle("active", i === idx));

  const isJumpers = idx === SCHEMES.length;
  document.getElementById("controlsBar").style.display = isJumpers ? "none" : "flex";
  document.getElementById("canvasBox").style.display = isJumpers ? "none" : "flex";
  document.getElementById("infoPanel").style.display = isJumpers ? "none" : "block";
  document.getElementById("jumpersGrid").style.display = isJumpers ? "grid" : "none";

  if (!isJumpers) {
    drawSchematic(SCHEMES[currentTab]);
    updateStepView();
  }
}

function drawSchematic(scheme) {
  const svg = document.getElementById("schematicSvg");
  svg.innerHTML = "";

  // Линии проводов
  scheme.wires.forEach(w => {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", w.d);
    path.setAttribute("id", w.id);
    path.setAttribute("class", "wire");
    svg.appendChild(path);

    if (w.label) {
      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", w.lx);
      txt.setAttribute("y", w.ly);
      txt.setAttribute("class", "wire-num");
      txt.textContent = w.label;
      svg.appendChild(txt);
    }
  });

  // Блоки аппаратов
  scheme.nodes.forEach(n => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", n.x);
    rect.setAttribute("y", n.y);
    rect.setAttribute("width", n.w);
    rect.setAttribute("height", n.h);
    rect.setAttribute("id", "node_" + n.id);
    rect.setAttribute("class", "node-box");
    g.appendChild(rect);

    const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
    lbl.setAttribute("x", n.x + n.w / 2);
    lbl.setAttribute("y", n.y + 18);
    lbl.setAttribute("class", "node-label");
    lbl.textContent = n.label;
    g.appendChild(lbl);

    const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
    sub.setAttribute("x", n.x + n.w / 2);
    sub.setAttribute("y", n.y + 34);
    sub.setAttribute("class", "node-sub");
    sub.textContent = n.sub;
    g.appendChild(sub);

    svg.appendChild(g);
  });
}

function updateStepView() {
  const scheme = SCHEMES[currentTab];
  const step = scheme.steps[currentStep];

  document.getElementById("stepCounter").textContent = `Шаг ${currentStep + 1} / ${scheme.steps.length}`;
  document.getElementById("stepTitle").textContent = step.title;
  document.getElementById("stepChain").textContent = step.chain;
  document.getElementById("stepDesc").textContent = step.desc;

  scheme.wires.forEach(w => {
    const el = document.getElementById(w.id);
    if (el) el.classList.toggle("active", step.activeWires.includes(w.id));
  });

  scheme.nodes.forEach(n => {
    const el = document.getElementById("node_" + n.id);
    if (el) {
      el.classList.remove("active", "energized");
      if (step.activeNodes.includes(n.id)) el.classList.add("active");
      else if (step.energizedNodes.includes(n.id)) el.classList.add("energized");
    }
  });
}

function nextStep() {
  const scheme = SCHEMES[currentTab];
  currentStep = (currentStep + 1) % scheme.steps.length;
  updateStepView();
}

function prevStep() {
  const scheme = SCHEMES[currentTab];
  currentStep = (currentStep - 1 + scheme.steps.length) % scheme.steps.length;
  updateStepView();
}

function resetScheme() {
  stopAuto();
  currentStep = 0;
  updateStepView();
}

function toggleAuto() {
  if (autoTimer) {
    stopAuto();
  } else {
    document.getElementById("autoBtn").classList.add("auto-active");
    document.getElementById("autoBtn").textContent = "⏸ Пауза";
    autoTimer = setInterval(nextStep, 3500);
  }
}

function stopAuto() {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
  }
  const btn = document.getElementById("autoBtn");
  if (btn) {
    btn.classList.remove("auto-active");
    btn.textContent = "⏯ Автозапуск";
  }
}

function renderJumpers() {
  const grid = document.getElementById("jumpersGrid");
  grid.innerHTML = JUMPERS.map(j => `
    <div class="jumper-card">
      <h3>${j.title}</h3>
      <p><strong>Симптом/Причина:</strong> ${j.desc}</p>
      <p><strong>Действия / Перемычка:</strong> ${j.fix}</p>
    </div>
  `).join("");
}

window.onload = initApp;
